<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2200" viewBox="0 0 1200 2200"><defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7EBDD"/><stop offset="1" stop-color="#FFF9F3"/></linearGradient><linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B170D"/><stop offset="1" stop-color="#5A321B"/></linearGradient></defs><rect width="1200" height="2200" fill="#FFF9F3"/><style>text{font-family:Poppins,Arial,sans-serif;fill:#1E140F}.brand{font-size:31px;font-weight:700}.nav{font-size:17px}.h1{font-size:54px;font-weight:700}.h2{font-size:38px;font-weight:700}.p{font-size:21px}.small{font-size:17px}.eyebrow{font-size:13px;font-weight:700;letter-spacing:4px;fill:#C66A1A}.white{fill:#fff}.muted{fill:#9A887A}.card{fill:#fff;stroke:#E7D8C8;stroke-width:1}.img{fill:#A8998E}.btn{fill:#C66A1A}.btnOutline{fill:none;stroke:#C66A1A;stroke-width:2}</style><rect x="0" y="0" width="1200" height="120" fill="#2B170D"/><rect x="72" y="42" width="28" height="22" rx="5" fill="#fff"/><path d="M100 47 C116 47 116 63 100 63" fill="none" stroke="#fff" stroke-width="4"/><line x1="69" y1="68" x2="106" y2="68" stroke="#fff" stroke-width="3"/><text x="120" y="75" class="brand white">Smart<tspan fill="#C66A1A">Coffee</tspan></text><text x="625" y="73" class="nav white">Início</text><text x="705" y="73" class="nav white">Sobre</text><text x="790" y="73" class="nav white">Produtos</text><text x="890" y="73" class="nav white">Ambiente</text><text x="990" y="73" class="nav white">Contato</text><rect x="1080" y="32" width="100" height="54" rx="27" class="btn"/><text x="1091" y="66" class="small white">Cardápio</text><rect x="0" y="120" width="1200" height="400" fill="url(#hero)"/><text x="70" y="190" class="eyebrow">SABORES QUE CONECTAM</text><text x="70" y="270" class="h1">Café que</text><text x="70" y="330" class="h1">conecta pessoas</text><text x="70" y="378" class="p">Mais que café, uma experiência.</text><rect x="70" y