<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS - Grid</title>
</head>
<body>
    <header>
        <nav>
            <ul class="grid-ex1">
                <li>
                    <article>
                        Exemplo 1
                    </article>
                </li>
                <li>
                    <article>
                        Exemplo 2
                    </article>
                </li>
                <li>
                    <article>
                        Exemplo 3
                    </article>
                </li>
            </ul>
        </nav>
    </header>

    <section class="grid-gal">
        <header>
            <h2>Nosso Conteúdo</h2>
        </header>
        <ul class="grid-gal-img">
            <li>
                <figure>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRqTEM4qqlI68qAB57FeDLS1yKsVaGF26zTLCUHPC7fng&s=10" alt="Imagem exemplo 1">
                </figure>
            </li>
            <li>
                <figure>
                    <img src="https://admin.cnnbrasil.com.br/wp-content/uploads/sites/12/2026/07/homem-aranha-capa-e1785195345395.jpg?w=1200&h=1200&crop=1" alt="Imagem exemplo 2">
                </figure>
            </li>
            <li>
                <figure>
                    <img src="https://upload.wikimedia.org/wikipedia/pt/4/4d/Frank_castle_punisher.jpg?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original" alt="Imagem exemplo 3">
                </figure>
            </li>
            <li>
                <figure>
                    <img src="https://static.wikia.nocookie.net/herois/images/e/ea/Action_Comics_1000_Variant_Cover.webp/revision/latest?cb=20220625003155&path-prefix=pt-br" alt="Imagem exemplo 4">
                </figure>
            </li>
        </ul>
    </section>

    <section>
        <header>
            <ul class="flex-grid">
                <li>
                    <article>
                        Flex 1
                    </article>
                </li>
                <li>
                    <article>
                        Flex 2
                    </article>
                </li>
                <li>
                    <article>
                        Flex 3
                    </article>
                </li>
            </ul>
        </header>        
    </section>

    <section>
        <ul class="lab-grid">
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
            <li>5</li>
            <li>6</li>
            <!-- li{$}*8 Inserir lista numerada automática -->
        </ul>
    </section>

</body>
</html>
