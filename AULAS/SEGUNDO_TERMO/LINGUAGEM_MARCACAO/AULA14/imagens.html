<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="imagens.css">
    <title>Revisão Imagens e Vídeos</title>
</head>
<body>
   <h1>Trabalhando com Imagens</h1>
   <h2>Imagem responsiva básica</h2>
        <figure class="resp-bas">
                <img src="https://tse2.mm.bing.net/th/id/OIP.PQdurkBErSPWV1uXffOoIgHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Imagem 1">
        </figure>
   
    <h2>Imagem com Recorte</h2>
        <figure class="img-rec">
            <img src="https://2.bp.blogspot.com/-9AnrwOc4OkI/XBkp99UexCI/AAAAAAAAExw/ZoWYZQSX5NwDzl_XcgXOS_1yQ9vdmyAqQCLcBGAs/s1600/Pets1.jpg" alt="Imagem 2">
        </figure>

    <h2>Imagem em formato de cards</h2>
        <figure class="img-card">
            <img src="https://tse4.mm.bing.net/th/id/OIP.G4XQDUrK5IOBngdgq8xRLwHaD_?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Imagem 3">
        </figure>

    <h2>Personalização</h2>
        <figure class="pers-img">
            <img src="https://i.pinimg.com/originals/a6/a5/f1/a6a5f16cfd53ae659f2e99f7752ec647.jpg" alt="Imagem 4">
        </figure>

    <h2>Imagens em Grid</h2>
        <section class="sec-grid">
            <article class="img-grid">
                <img src="https://th.bing.com/th/id/R.3792eb94ae38d6675673ed67cf399601?rik=fsDURKXTmgxA4w&pid=ImgRaw&r=0" alt="Imagem 5">
            </article>
            <article class="img-grid">
                <img src="https://tse4.mm.bing.net/th/id/OIP.WqJa6OaTsDqhs6sT8IPLUgHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Imagem 6">
            </article>
            <article class="img-grid">
                <img src="https://tse2.mm.bing.net/th/id/OIP.XYU6cA17RrdEHaOxzg4S5AHaD_?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Imagem 7">
            </article>
        </section>

        <section class="video">
            <h2>Trailer do Filme</h2>
            <iframe class="video-bd" width="560" height="315" src="https://www.youtube-nocookie.com/embed/pLDFYKIta4g?si=syGbFZ-6lxwLkk6l" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>

    <video width="640" height="360" controls poster="capa.jpg">
            <source src="meu-video.mp4" type="video/mp4">
            <source src="meu-video.webm" type="video/webm">
            Seu navegador não suporta a tag de vídeo.
    </video>   
       
</body>
</html>
