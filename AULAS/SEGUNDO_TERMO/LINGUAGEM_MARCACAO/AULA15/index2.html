<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <title>Cartões</title>
</head>
<body>
    <h1>Modelo de Cartão 1</h1>
    <section>
        <article class="card" style="width: 18rem;">
            <img src="#" class="card-img-top" alt="Imagem Cartão 1">
            <aside class="card-body">
                <h5 class="card-title">Cartão 1</h5>
                <p class="card-text">Exemplo de texto para nosso cartão</p>
                <a href="#" class="btn btn-primary">Ver Cartão</a>
            </aside>
        </article>
    </section>

    <h1>Modelo de Cartão 2</h1>
    <section class="d-flex justify-content-center">
        <article class="card text-bg-dark border border-danger rounded-5">
            <aside class="card-header text-primary">
                Titulo do Cartão 2
            </aside>
            <header class="card-body">
                <h5 class="card-title">Conteúdo do Cartão</h5>
                <p class="badge card-text text-wrap fs-6 fw-light">Conteúdo referente ao cartão modelo 2</p>
                <a href="#c" class="btn btn-danger">Ver Cartão 2</a>
            </header>
        </article>
    </section>

    <h1>Vários Cartões</h1>
    <section class="card-group">
        <article class="card">
            <img src="..." alt="Grupo de Cartão 1">
            <aside class="card-body">
                <h5 class="card-title">Cartão Grupo 1</h5>
                <p class="card-text">Conteúdo de texto do grupo de cartão 1</p>
                <p class="card-text"><small class="text-body-secondary">Complemento para o cartão</small></p>
            </aside>
        </article>

    </section>

</body>
</html>
