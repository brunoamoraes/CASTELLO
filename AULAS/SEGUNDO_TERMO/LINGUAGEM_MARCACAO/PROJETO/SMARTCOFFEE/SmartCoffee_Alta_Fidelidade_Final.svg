<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2300" viewBox="0 0 1200 2300">

<defs>

    <linearGradient
        id="hero"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
    >
        <stop
            offset="0"
            stop-color="#F7EBDD"
        />

        <stop
            offset="1"
            stop-color="#FFF9F3"
        />
    </linearGradient>


    <linearGradient
        id="dark"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
    >
        <stop
            offset="0"
            stop-color="#2B170D"
        />

        <stop
            offset="1"
            stop-color="#5A321B"
        />
    </linearGradient>


    <filter
        id="shadow"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%"
    >
        <feDropShadow
            dx="0"
            dy="12"
            stdDeviation="14"
            flood-color="#2B170D"
            flood-opacity=".12"
        />
    </filter>


    <style>
        text {
            font-family:
                Poppins,
                Arial,
                sans-serif;

            fill:
                #1E140F;
        }

        .brand {
            font-size:
                31px;

            font-weight:
                700;
        }

        .nav {
            font-size:
                17px;
        }

        .h1 {
            font-size:
                56px;

            font-weight:
                700;
        }

        .h2 {
            font-size:
                38px;

            font-weight:
                700;
        }

        .p {
            font-size:
                20px;
        }

        .small {
            font-size:
                16px;
        }

        .eyebrow {
            font-size:
                13px;

            font-weight:
                700;

            letter-spacing:
                4px;

            fill:
                #C66A1A;
        }

        .white {
            fill:
                #FFFFFF;
        }

        .muted {
            fill:
                #9A887A;
        }

        .card {
            fill:
                #FFFFFF;

            stroke:
                #E7D8C8;

            stroke-width:
                1;
        }

        .image {
            fill:
                #B3A79E;
        }

        .imageDark {
            fill:
                #9A887A;
        }

        .button {
            fill:
                #C66A1A;
        }

        .buttonOutline {
            fill:
                none;

            stroke:
                #C66A1A;

            stroke-width:
                2;
        }
    </style>

</defs>


